# Pipeline CI/CD IVèS — fontventa
#
# Se déclenche sur un tag <Version>-<Release>
#
# - stage .pre     : check_rpm_doesnt_exist, le RPM est-il déjà publié ?
# - stage build    : install.ksh prereq puis ./install.ksh rpm, sur AlmaLinux 9
# - stage test     : suite gtest de libmedikit + installation du RPM produit
# - stage publish  : dépôt forks-testing, sur web0.eu.ives.fr
# - stage .post    : notification Teams (succès/échec)

variables:
  RHEL_VERSION: "9"
  PUBLISH_REPO: "forks"

.tag_release: &tag_release
  if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-\d+|-rc\d+)?$/'

# Sans ce bloc, GitLab crée quand même une pipeline (vide) à chaque push de
# branche ou de merge request : les règles de chaque job les excluent déjà,
# mais la pipeline elle-même apparaîtrait dans la liste. On la supprime à la
# source : aucune pipeline n'est créée hors tag de release.
workflow:
  rules:
    - <<: *tag_release

stages:
  - build
  - test
  - publish

check_rpm_doesnt_exist:
  stage: .pre
  rules:
    - <<: *tag_release
  image: $CI_REGISTRY/gitlab-ci/docker-images:rpmbuild_el$RHEL_VERSION
  script:
    - |
      NVR=$(rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}\n' --specfile fontventa.spec | sed -n 1p)
      RPM="${NVR}.x86_64.rpm"
      URL="https://rpm.ives.fr/${RHEL_VERSION}/${PUBLISH_REPO}-testing/x86_64/${RPM}"
      echo "Checking ${URL}"
      if curl -sfI "$URL" >/dev/null 2>&1; then echo "Already published: ${RPM}"; exit 1; fi
      echo "OK: ${RPM} not published, build allowed."

build_rpm:
  stage: build
  rules:
    - <<: *tag_release
  image: $CI_REGISTRY/gitlab-ci/docker-images:rpmbuild_el$RHEL_VERSION
  before_script:
    # installe notamment asteriskv-devel, mp4v2-devel et ffmpeg-devel >= 9
    - ./install.ksh prereq
  script:
    - ./install.ksh rpm nosign
    - |
      shopt -s nullglob
      built=(*.rpm)
      if [ ${#built[@]} -eq 0 ]; then
        echo "Aucun RPM produit par ./install.ksh rpm." >&2
        exit 1
      fi
      printf 'RPM produit : %s\n' "${built[@]}"
  artifacts:
    paths:
      - "*.rpm"
    expire_in: 1 week

# Suite GoogleTest de libmedikit. Elle ne dépend pas du RPM : « needs: [] » la
# lance dès le début de la pipeline, en parallèle du build.
# Le sous-make force ASTERISK=no ; c'est pourquoi ce job ne partage aucun
# espace de travail avec build_rpm, qui bâtit la variante ASTERISK=yes.
unit_tests:
  stage: test
  rules:
    - <<: *tag_release
  image: $CI_REGISTRY/gitlab-ci/docker-images:rpmbuild_el$RHEL_VERSION
  needs: []
  before_script:
    - ./install.ksh prereq
    - dnf -y install gtest-devel
  script:
    - make -C libmedikit ASTERISK=no check

test_install:
  stage: test
  rules:
    - <<: *tag_release
  image: $CI_REGISTRY/gitlab-ci/docker-images:rpmbuild_el$RHEL_VERSION
  needs:
    - job: build_rpm
  script:
    - yum localinstall -y fontventa*.rpm

publish_rpm:
  stage: publish
  rules:
    - <<: *tag_release
  needs:
    - job: build_rpm
    - job: unit_tests
    - job: test_install
  image: $CI_REGISTRY/gitlab-ci/docker-images:rpm_publisher
  script:
    - |
      for rpm in *.rpm; do
        arch=$(rpm -qp --queryformat '%{ARCH}' "$rpm")
        echo "publish $(basename "$rpm") -> $arch"
        scp "$rpm" "jenkins@web0.eu.ives.fr:/data/packages/${RHEL_VERSION}/${PUBLISH_REPO}-testing/${arch}/"
      done
    - ssh jenkins@web0.eu.ives.fr /data/packages/${RHEL_VERSION}/met_au_propre.sh

notify_success:
  stage: .post
  rules:
    - <<: *tag_release
      when: on_success
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      curl -sf -H "Content-Type: application/json" -d '{
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "00ff00",
        "title": "✅ BUILD SUCCESS fontventa '"$CI_COMMIT_REF_NAME"'",
        "text": "Pipeline : '"$CI_PIPELINE_URL"'"
      }' "https://outlook.office.com/webhook/a8d2a9bb-d91a-48b9-8774-a1907c4bce10@dda7df9a-8948-410e-8cd6-c830a3370b09/JenkinsCI/1c7e9437aaad42a8a2407afabdbfc096/37c3465b-9ab9-4181-8220-d38b79c27fe3"

notify_failure:
  stage: .post
  rules:
    - <<: *tag_release
      when: on_failure
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      curl -sf -H "Content-Type: application/json" -d '{
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "ff0000",
        "title": "💔 BUILD FAIL fontventa '"$CI_COMMIT_REF_NAME"'",
        "text": "Pipeline : '"$CI_PIPELINE_URL"'"
      }' "https://outlook.office.com/webhook/a8d2a9bb-d91a-48b9-8774-a1907c4bce10@dda7df9a-8948-410e-8cd6-c830a3370b09/JenkinsCI/1c7e9437aaad42a8a2407afabdbfc096/37c3465b-9ab9-4181-8220-d38b79c27fe3"
